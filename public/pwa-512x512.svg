<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="cyanGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg512)" stroke="#334155" stroke-width="8"/>
  <g transform="translate(256, 256)">
    <!-- Layer 1 Base -->
    <path d="M-128,60 L0,124 L128,60 L0,-4 Z" fill="#3b82f6" fill-opacity="0.25" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round"/>
    <!-- Layer 2 Middle -->
    <path d="M-106,16 L0,70 L106,16 L0,-38 Z" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="8" stroke-linejoin="round"/>
    <!-- Layer 3 Top -->
    <path d="M-86,-28 L0,16 L86,-28 L0,-72 Z" fill="#a855f7" fill-opacity="0.45" stroke="#c084fc" stroke-width="8" stroke-linejoin="round"/>
    <!-- Extruder Nozzle -->
    <path d="M-28,-148 L28,-148 L28,-112 L10,-86 L0,-70 L-10,-86 L-28,-112 Z" fill="url(#brandGrad512)" filter="url(#glow512)"/>
    <!-- Extruder Filament Line -->
    <line x1="0" y1="-210" x2="0" y2="-148" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" stroke-dasharray="8 8"/>
    <!-- Glow dot at nozzle tip -->
    <circle cx="0" cy="-70" r="9" fill="#fbcfe8" filter="url(#glow512)"/>
  </g>
</svg>
