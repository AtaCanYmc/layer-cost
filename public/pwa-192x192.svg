<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#bg)" stroke="#334155" stroke-width="3"/>
  <g transform="translate(96, 96)">
    <!-- Layer 1 Base -->
    <path d="M-48,22 L0,46 L48,22 L0,-2 Z" fill="#3b82f6" fill-opacity="0.25" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
    <!-- Layer 2 Middle -->
    <path d="M-40,6 L0,26 L40,6 L0,-14 Z" fill="#6366f1" fill-opacity="0.35" stroke="#818cf8" stroke-width="3" stroke-linejoin="round"/>
    <!-- Layer 3 Top -->
    <path d="M-32,-10 L0,6 L32,-10 L0,-26 Z" fill="#a855f7" fill-opacity="0.45" stroke="#c084fc" stroke-width="3" stroke-linejoin="round"/>
    <!-- Extruder Nozzle -->
    <path d="M-10,-55 L10,-55 L10,-42 L4,-32 L0,-26 L-4,-32 L-10,-42 Z" fill="url(#brandGrad)" filter="url(#glow)"/>
    <!-- Extruder Filament Line -->
    <line x1="0" y1="-78" x2="0" y2="-55" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 3"/>
    <!-- Glow dot at nozzle tip -->
    <circle cx="0" cy="-26" r="3.5" fill="#fbcfe8" filter="url(#glow)"/>
  </g>
</svg>
